name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/snowfall-prediction-map-FZik4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API credentials
        env:
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}
          WEATHERNEXT_EMAIL: ${{ secrets.WEATHERNEXT_EMAIL }}
        run: |
          chmod +x .github/workflows/inject-secrets.sh
          .github/workflows/inject-secrets.sh

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
